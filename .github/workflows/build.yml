name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            source: target/x86_64-unknown-linux-gnu/release/muspector
            artifact: dist/muspector-linux-x86_64
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            source: target/x86_64-pc-windows-msvc/release/muspector.exe
            artifact: dist/muspector-windows-x86_64.exe
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            source: target/aarch64-apple-darwin/release/muspector
            artifact: dist/muspector-macos-arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          libfontconfig-dev libglib2.0-dev libssl-dev libvulkan1
          libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-release
          cache-on-failure: true

      - name: Build optimized executable
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.source }}" "${{ matrix.artifact }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod 755 "${{ matrix.artifact }}"
          fi

      - name: Ad-hoc sign macOS executable
        if: runner.os == 'macOS'
        run: codesign --force --sign - --timestamp=none "${{ matrix.artifact }}"

      - name: Record executable size
        shell: bash
        run: |
          ls -lh "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.artifact }}"

      - name: Upload single executable
        uses: actions/upload-artifact@v7
        with:
          path: ${{ matrix.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 30
