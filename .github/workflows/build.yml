name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            source: target/x86_64-unknown-linux-gnu/release/muspector
            asset: muspector-linux-x86_64
            artifact: dist/muspector-linux-x86_64
          - name: Windows x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            source: target/x86_64-pc-windows-msvc/release/muspector.exe
            asset: muspector-windows-x86_64.exe
            artifact: dist/muspector-windows-x86_64.exe
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            source: target/aarch64-apple-darwin/release/muspector
            asset: muspector-macos-arm64
            artifact: dist/muspector-macos-arm64

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install --yes --no-install-recommends
          libfontconfig-dev libglib2.0-dev libssl-dev libvulkan1
          libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}-release
          cache-on-failure: true

      - name: Build optimized executable
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage executable
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.source }}" "${{ matrix.artifact }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod 755 "${{ matrix.artifact }}"
          fi

      - name: Ad-hoc sign macOS executable
        if: runner.os == 'macOS'
        run: codesign --force --sign - --timestamp=none "${{ matrix.artifact }}"

      - name: Record executable size
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ls -lh "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.artifact }}"

      - name: Record executable size on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Item "${{ matrix.artifact }}" | Format-List Name, Length
          Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256

      - name: Verify Windows application manifest
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mt = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter mt.exe -File -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "x64" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw "Windows SDK mt.exe was not found" }
          $mtPath = $mt.FullName
          $manifest = Join-Path $env:RUNNER_TEMP "muspector.manifest"
          & $mtPath "-inputresource:${{ matrix.artifact }};#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the embedded manifest" }
          $content = Get-Content $manifest -Raw
          if ($content -notmatch 'Microsoft\.Windows\.Common-Controls' -or
              $content -notmatch 'version="6\.0\.0\.0"') {
            throw "The executable does not activate Common Controls v6"
          }

      - name: Upload single executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.artifact }}
          archive: false
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish latest release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download executables
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: muspector-*
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          test -f dist/muspector-linux-x86_64
          test -f dist/muspector-windows-x86_64.exe
          test -f dist/muspector-macos-arm64

      - name: Publish rolling latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Latest build" \
              --target "$GITHUB_SHA" \
              --latest \
              --notes "Automated build from $GITHUB_SHA. Model packages are not bundled; connect them through a muspector-models adapter."
          else
            gh release create latest \
              --verify-tag \
              --title "Latest build" \
              --target "$GITHUB_SHA" \
              --latest \
              --notes "Automated build from $GITHUB_SHA. Model packages are not bundled; connect them through a muspector-models adapter."
          fi

          gh release upload latest dist/* --clobber
